{% extends "base.html" %}
{% block content %}
<div class="space-y-6">

  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-semibold text-gray-800">Categories</h1>
      <p class="text-gray-500 mt-1 text-sm">Organize and manage device categories</p>
    </div>
    <button onclick="openAddModal()" class="btn-accent flex items-center gap-2 page-header-action">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add Category
    </button>
  </div>

  <div class="card p-6">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-800">Categories</h2>
      <span id="cat-count" class="text-sm text-gray-400"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Category Name</th>
          <th>Description</th>
          <th style="width:100px;text-align:center">Actions</th>
        </tr>
      </thead>
      <tbody id="cat-tbody">
        <tr><td colspan="4" class="text-center text-gray-400 py-8">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ADD MODAL -->
<div id="add-modal" class="modal-overlay">
  <div class="modal" style="max-width:440px">
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-3">
        <div style="width:36px;height:36px;background:#F0FDF4;border-radius:10px;display:flex;align-items:center;justify-content:center">
          <svg width="18" height="18" fill="none" stroke="#059669" stroke-width="2" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <h2 class="text-lg font-semibold text-gray-800">Add New Category</h2>
      </div>
      <button onclick="closeAddModal()" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:22px;line-height:1">×</button>
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Category Name <span style="color:#dc2626">*</span></label>
        <input type="text" id="add-name" placeholder="e.g. Router" oninput="clearErr('add','name')" style="width:100%;box-sizing:border-box"/>
        <p class="text-xs mt-1" style="color:#dc2626;min-height:16px" id="add-name-err"></p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Description</label>
        <textarea id="add-desc" rows="3" placeholder="Describe this category…" style="width:100%;box-sizing:border-box;resize:vertical"></textarea>
      </div>
    </div>
    <div class="flex gap-3 mt-6 pt-5" style="border-top:1px solid #f3f4f6">
      <button onclick="closeAddModal()" class="btn-outline" style="flex:1">Cancel</button>
      <button onclick="submitAdd()" id="add-btn" class="btn-primary" style="flex:1">Save Category</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div id="edit-modal" class="modal-overlay">
  <div class="modal" style="max-width:440px">
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-3">
        <div style="width:36px;height:36px;background:#EFF6FF;border-radius:10px;display:flex;align-items:center;justify-content:center">
          <svg width="18" height="18" fill="none" stroke="#3A7CA5" stroke-width="2" viewBox="0 0 24 24">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </div>
        <h2 class="text-lg font-semibold text-gray-800">Edit Category</h2>
      </div>
      <button onclick="closeEditModal()" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:22px;line-height:1">×</button>
    </div>
    <input type="hidden" id="edit-id"/>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Category Name <span style="color:#dc2626">*</span></label>
        <input type="text" id="edit-name" placeholder="e.g. Router" oninput="clearErr('edit','name')" style="width:100%;box-sizing:border-box"/>
        <p class="text-xs mt-1" style="color:#dc2626;min-height:16px" id="edit-name-err"></p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Description</label>
        <textarea id="edit-desc" rows="3" placeholder="Describe this category…" style="width:100%;box-sizing:border-box;resize:vertical"></textarea>
      </div>
    </div>
    <div class="flex gap-3 mt-6 pt-5" style="border-top:1px solid #f3f4f6">
      <button onclick="closeEditModal()" class="btn-outline" style="flex:1">Cancel</button>
      <button onclick="submitEdit()" id="edit-btn" class="btn-primary" style="flex:1">Save Changes</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div id="del-modal" class="modal-overlay modal-center">
  <div class="modal" style="max-width:360px;text-align:center">
    <div style="width:56px;height:56px;background:#FEF2F2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
      <svg width="26" height="26" fill="none" stroke="#dc2626" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
    </div>
    <h2 class="text-lg font-semibold text-gray-800 mb-2">Delete Category?</h2>
    <p class="text-sm text-gray-500 mb-6">
      Delete <strong id="del-name" class="text-gray-800"></strong>?<br>
      <span style="color:#dc2626;font-size:12px">This action cannot be undone.</span>
    </p>
    <div class="flex gap-3">
      <button onclick="closeDelModal()" class="btn-outline" style="flex:1">Cancel</button>
      <button onclick="submitDelete()" id="del-btn" style="flex:1;background:#dc2626;color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500">Delete</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let deleteTargetId = null;

function clearErr(p, f) {
  document.getElementById(`${p}-${f}-err`).textContent = '';
  document.getElementById(`${p}-${f}`).style.borderColor = '';
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadCategories() {
  const res  = await fetch('/api/categories');
  const list = await res.json();
  document.getElementById('cat-count').textContent = `${list.length} categories`;
  const tbody = document.getElementById('cat-tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-gray-400 py-10">No categories yet.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map((c, i) => `
    <tr class="hover:bg-gray-50 transition">
      <td class="text-gray-400 text-xs font-mono">${i+1}</td>
      <td class="font-semibold text-gray-800">${esc(c.category_name)}</td>
      <td class="text-gray-500 text-sm">${esc(c.description) || '<span style="color:#d1d5db;font-style:italic">—</span>'}</td>
      <td>
        <div class="flex gap-2" style="justify-content:center">
          <button class="btn-edit" onclick="openEditModal(${c.category_id},'${escJs(c.category_name)}','${escJs(c.description)}')" title="Edit">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="btn-danger" onclick="openDelModal(${c.category_id},'${escJs(c.category_name)}')" title="Delete">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </div>
      </td>
    </tr>`).join('');
}

function esc(s)   { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escJs(s) { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ── ADD ───────────────────────────────────────────────────────────────────────
function openAddModal() {
  document.getElementById('add-name').value = '';
  document.getElementById('add-desc').value = '';
  document.getElementById('add-name-err').textContent = '';
  document.getElementById('add-modal').classList.add('open');
  setTimeout(() => document.getElementById('add-name').focus(), 80);
}
function closeAddModal() { document.getElementById('add-modal').classList.remove('open'); }

async function submitAdd() {
  const name = document.getElementById('add-name').value.trim();
  if (!name) {
    document.getElementById('add-name-err').textContent = 'Category name is required';
    document.getElementById('add-name').style.borderColor = '#dc2626';
    return;
  }
  document.getElementById('add-btn').disabled = true;
  const res  = await fetch('/api/categories', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, description: document.getElementById('add-desc').value.trim() })
  });
  const data = await res.json();
  document.getElementById('add-btn').disabled = false;
  if (data.success) { closeAddModal(); loadCategories(); showToast(`✅ "${name}" added`); }
  else showToast('❌ ' + data.error, 'error');
}

// ── EDIT ──────────────────────────────────────────────────────────────────────
function openEditModal(id, name, desc) {
  document.getElementById('edit-id').value   = id;
  document.getElementById('edit-name').value = name;
  document.getElementById('edit-desc').value = desc;
  document.getElementById('edit-name-err').textContent = '';
  document.getElementById('edit-modal').classList.add('open');
  setTimeout(() => document.getElementById('edit-name').focus(), 80);
}
function closeEditModal() { document.getElementById('edit-modal').classList.remove('open'); }

async function submitEdit() {
  const name = document.getElementById('edit-name').value.trim();
  if (!name) {
    document.getElementById('edit-name-err').textContent = 'Category name is required';
    document.getElementById('edit-name').style.borderColor = '#dc2626';
    return;
  }
  const id   = document.getElementById('edit-id').value;
  document.getElementById('edit-btn').disabled = true;
  const res  = await fetch(`/api/categories/${id}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, description: document.getElementById('edit-desc').value.trim() })
  });
  const data = await res.json();
  document.getElementById('edit-btn').disabled = false;
  if (data.success) { closeEditModal(); loadCategories(); showToast(`✅ "${name}" updated`); }
  else showToast('❌ ' + data.error, 'error');
}

// ── DELETE ────────────────────────────────────────────────────────────────────
function openDelModal(id, name) {
  deleteTargetId = id;
  document.getElementById('del-name').textContent = name;
  document.getElementById('del-modal').classList.add('open');
}
function closeDelModal() { document.getElementById('del-modal').classList.remove('open'); deleteTargetId = null; }

async function submitDelete() {
  if (!deleteTargetId) return;
  const name = document.getElementById('del-name').textContent;
  document.getElementById('del-btn').disabled = true;
  const res  = await fetch(`/api/categories/${deleteTargetId}`, { method: 'DELETE' });
  const data = await res.json();
  document.getElementById('del-btn').disabled = false;
  if (data.success) { closeDelModal(); loadCategories(); showToast(`🗑️ "${name}" deleted`); }
  else showToast('❌ ' + data.error, 'error');
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeAddModal(); closeEditModal(); closeDelModal();
});

loadCategories();
</script>
{% endblock %}
